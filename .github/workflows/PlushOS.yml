      - name: Build ISO
        run: |
          set -o pipefail
          docker run --rm --privileged -e ARCH=arm64 -e DEBIAN_FRONTEND=noninteractive \
            -v "$PWD/plushos-iso-builder:/work" -w /work debian:bookworm \
            bash -c "apt-get update && apt-get install -y ca-certificates && ./build.sh" 2>&1 | tee plushos-iso-builder/docker.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plushos-arm64
          path: |
            plushos-iso-builder/*.iso
            plushos-iso-builder/build.log
            plushos-iso-builder/docker.log
